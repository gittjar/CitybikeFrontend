
<article class="colorbar bg-gradient-to-r from-cyan-500 via-sky-300 to-pink-500"></article>

<app-loading *ngIf="loading"></app-loading>
<div class="header-wrapper">
  <h2>
    <span class="bg-gray-700 bg-opacity-75 text-white text-2xl font-bold p-4 rounded-lg shadow-lg">
    Kaupunkipyöräasemat
    <fa-icon [icon]="faBicycle"></fa-icon>
    </span>
  </h2>
</div>

<section class="bg-stone-700 text-white font-bold p-4 rounded-lg shadow-lg mx-4">
<div class="nav-item">
  Etsi ja lajittele <fa-icon [icon]="MagnifyingGlass"></fa-icon>
  <br>
  <input type="text" class="searchTerm" placeholder="Kirjoita hakusana.." [(ngModel)]="term" />
</div>

<div class="buttons-container">
  <button *ngFor="let city of uniqueCities" 
          (click)="toggleCitySelection(city)" 
          [ngClass]="{'selected': isCitySelected(city)}" 
          class="city-button">
    {{ city }} <fa-icon [icon]="ArrowRightLong"></fa-icon>
  </button>
  <button (click)="showAll()" class="city-button">
    Näytä kaikki <fa-icon [icon]="ArrowRightLong"></fa-icon>
  </button>
</div>
</section>

<div class="stations-list">
  <table>
    <thead>
      <tr>
        <th (click)="sortStations('nimi')">
          Nimi <fa-icon [icon]="faSort"></fa-icon>
        </th>
        <th (click)="sortStations('kaupunki')">
          Kaupunki <fa-icon [icon]="faSort"></fa-icon>
        </th>
        <th (click)="sortStations('kapasiteet')">
          Kapasiteet <fa-icon [icon]="faSort"></fa-icon>
        </th>
        <th (click)="sortStations('palautetut')">
          Palautetut <fa-icon [icon]="faSort"></fa-icon>
        </th>
        <th (click)="sortStations('lahdetyt')">
          Lähteneet <fa-icon [icon]="faSort"></fa-icon>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let station of filteredStations">
        <td><a [routerLink]="['/station-details', station.id]">{{ station.nimi }} <fa-icon [icon]="ArrowRightLong"></fa-icon></a></td>
        <td>{{ station.kaupunki }} </td>
        <td>{{ station.kapasiteet }}</td>
        <td>{{ station.palautetut }}</td>
        <td>{{ station.lahdetyt }}</td>
      </tr>
    </tbody>
  </table>
</div>
