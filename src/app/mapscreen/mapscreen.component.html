<article class="colorbar bg-gradient-to-r from-indigo-500 via-stone-900 to-pink-500"></article>

<app-loading *ngIf="loading"></app-loading>

<section class="main font-mono bg-stone-900 text-white p-4 mb-20">
    <section class="kartta bg-stone-800 p-6 rounded-lg shadow-lg w-full lg:w-3/4 mb-4 lg:mb-0">
        <div id="map" class="rounded-lg mb-4" style="height: 600px;"></div>
    </section>

    

    <section class="asema-data bg-stone-800 p-6 rounded-lg shadow-lg w-full lg:w-1/4">
        <div class="mt-4">
            <hr class="border-t-2 border-stone-700 mb-1">
        </div>
        <h5 class="text-base font-semibold mb-4 text-pink-500">Top-10 Lähtöasemat <fa-icon [icon]="ArrowRightFromBracket"></fa-icon></h5>
        <div class="top-asemat text-sm" *ngFor="let name of topDepartureStations">
            {{ name.station }} ({{ name.count }})
        </div>
        <div class="mt-4">
            <hr class="border-t-2 border-stone-700 mb-1">
        </div>
        <h5 class="text-base font-semibold mb-4 text-pink-500">TOP-10 Palautusasemat <fa-icon [icon]="RotareLeft"></fa-icon></h5>
        <div class="top-asemat text-sm" *ngFor="let name of topReturnStations">
            {{ name.station }} ({{ name.count }})
        </div>
    </section>
</section>
