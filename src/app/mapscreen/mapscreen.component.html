<article class="colorbar bg-gradient-to-r from-indigo-500 via-stone-900 to-pink-500"></article>

<app-loading *ngIf="loading"></app-loading>

<div class="header-wrapper">
    <h2>
      <span class="bg-gray-700 bg-opacity-75 text-white text-2xl font-bold p-4 rounded-lg shadow-lg">
      Kaupunkipyöräasemat kartalla
      </span>
    </h2>
  </div>

<section class="main font-mono bg-stone-900 text-white p-4 mb-20">
    <section class="kartta bg-stone-800 p-6 rounded-lg shadow-lg w-full lg:w-3/4 mb-4 lg:mb-0">
        <!-- Map Search Box (will be moved to map by JS) -->
        <input 
            id="pac-input" 
            type="text" 
            placeholder="Etsi lähistöllä olevia asemia (esim. Ooppera)..."
            class="map-search-input"
        />
        <div id="map" class="rounded-lg mb-4" style="height: 600px;"></div>
    </section>

    

    <section class="asema-data bg-stone-800 p-6 rounded-lg shadow-lg w-full lg:w-1/4">
        <div class="mt-4">
            <hr class="border-t-2 border-stone-700 mb-1">
        </div>
        <h5 class="text-base font-semibold mb-4 text-cyan-400">
            Top-10 Lähtöasemat <fa-icon [icon]="ArrowRightFromBracket"></fa-icon>
        </h5>
        <div class="top-asemat-item" *ngFor="let name of topDepartureStations; let i = index">
            <span class="rank-number">{{ i + 1 }}.</span>
            <a *ngIf="getStationIdByName(name.station)" 
               [routerLink]="['/station-details', getStationIdByName(name.station)]"
               class="station-link">
                {{ name.station }}
            </a>
            <span *ngIf="!getStationIdByName(name.station)" class="station-name-plain">
                {{ name.station }}
            </span>
            <span class="trip-count">({{ name.count }})</span>
            <button 
                *ngIf="getStationIdByName(name.station)"
                class="fav-btn-small" 
                (click)="toggleFavoriteByName(name.station, $event)"
                [class.is-favorite]="favoritesService.isFavorite(getStationIdByName(name.station)!)"
                [title]="favoritesService.isFavorite(getStationIdByName(name.station)!) ? 'Poista suosikeista' : 'Lisää suosikkeihin'">
                <fa-icon [icon]="faStar"></fa-icon>
            </button>
        </div>
        <div class="mt-4">
            <hr class="border-t-2 border-stone-700 mb-1">
        </div>
        <h5 class="text-base font-semibold mb-4 text-cyan-400">
            TOP-10 Palautusasemat <fa-icon [icon]="RotareLeft"></fa-icon>
        </h5>
        <div class="top-asemat-item" *ngFor="let name of topReturnStations; let i = index">
            <span class="rank-number">{{ i + 1 }}.</span>
            <a *ngIf="getStationIdByName(name.station)" 
               [routerLink]="['/station-details', getStationIdByName(name.station)]"
               class="station-link">
                {{ name.station }}
            </a>
            <span *ngIf="!getStationIdByName(name.station)" class="station-name-plain">
                {{ name.station }}
            </span>
            <span class="trip-count">({{ name.count }})</span>
            <button 
                *ngIf="getStationIdByName(name.station)"
                class="fav-btn-small" 
                (click)="toggleFavoriteByName(name.station, $event)"
                [class.is-favorite]="favoritesService.isFavorite(getStationIdByName(name.station)!)"
                [title]="favoritesService.isFavorite(getStationIdByName(name.station)!) ? 'Poista suosikeista' : 'Lisää suosikkeihin'">
                <fa-icon [icon]="faStar"></fa-icon>
            </button>
        </div>
    </section>
</section>
